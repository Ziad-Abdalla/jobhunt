name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: jobhunt-linux-x86_64
            ext: ""
          - os: macos-latest
            artifact: jobhunt-macos-arm64
            ext: ""
          - os: windows-latest
            artifact: jobhunt-windows-x86_64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Run tests
        run: |
          pip install pytest pytest-asyncio respx
          pytest -q
      - name: Build binary
        run: pyinstaller jobhunt.spec --clean --noconfirm
      - name: Rename binary
        shell: bash
        run: |
          mv "dist/jobhunt${{ matrix.ext }}" "dist/${{ matrix.artifact }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.ext }}

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Move artifacts to root of dist
        run: find dist -type f -exec mv {} dist/ \; || true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
