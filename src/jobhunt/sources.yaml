# Default job sources. Add your own via the Sources tab in the UI.
#
# Available source types: greenhouse, lever, ashby, workable, smartrecruiters,
# recruitee, workday, remoteok, hackernews, simplifyjobs, arbeitnow, jobicy,
# himalayas, themuse, jooble, arbeitsagentur, reed, wuzzuf, remotive,
# workingnomads, weworkremotely, pythonjobs, jsearch, reddit, careerjet,
# 4dayweek
#
# JSearch (jsearch) is a BYO-key indirect Egypt/MENA + remote route
# (RapidAPI, ~200 req/month free tier — add only a FEW). Set the key on the
# Settings page, then add targeted searches, e.g.:
#   - { source: jsearch, board: "developer|Egypt",        company: "(JSearch - Egypt)" }
#   - { source: jsearch, board: "developer|remote",       company: "(JSearch - remote)" }
#   - { source: jsearch, board: "software engineer|Cairo", company: "(JSearch - Cairo)" }
#   - { source: jsearch, board: "machine learning engineer|Egypt", company: "(JSearch - Egypt ML)" }
#   - { source: jsearch, board: "AI engineer|remote",     company: "(JSearch - remote AI)" }
#
# Careerjet (careerjet) is a BYO-affiliate-ID public search API with a real
# Egypt index (careerjet.com.eg). Free partner account at
# careerjet.com/partners — paste the affid on the Settings page, then e.g.:
#   - { source: careerjet, board: "python developer|Egypt", company: "(Careerjet Egypt)" }
#   - { source: careerjet, board: "machine learning|Egypt", company: "(Careerjet Egypt ML)" }

