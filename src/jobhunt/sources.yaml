# Default scrape sources. Tweak in local_sources.yaml (gitignored) for your own list.
# Each entry: { source: <type>, board: <slug>, company: <display name> }
# `source` must match a key in scrapers.SCRAPER_REGISTRY.
#
# Available source types: greenhouse, lever, ashby, workable, smartrecruiters,
# recruitee, workday, remoteok, hackernews
#
# Tip: many companies are on more than one ATS over time. If a board 404s,
# remove that line or try a different ATS for the same company.

