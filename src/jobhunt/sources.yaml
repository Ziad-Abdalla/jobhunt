# --- Workable / SmartRecruiters / Recruitee / Workday ---
# The default sources file ships only known-good Greenhouse/Lever/Ashby boards.
# These adapters are implemented and ready to use — add your own entries in
# local_sources.yaml (gitignored) once you have the slug for the company you care
# about. Pull the slug from the company's careers page URL.
#
# Examples (uncomment if these slugs still work for you):
# - { source: smartrecruiters, board: Bosch,    company: Bosch }
# - { source: workable, board: <company-slug>,  company: <Display> }
# - { source: recruitee, board: <subdomain>,    company: <Display> }
# - { source: workday, board: "tenant/wd5/Site", company: <Display> }

# --- Wide-net firehoses ---
- { source: remoteok,   board: dev,    company: "(RemoteOK feed)" }
- { source: hackernews, board: latest, company: "(HN Who is Hiring)" }
