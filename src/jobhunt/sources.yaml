# Available source types: greenhouse, lever, ashby, workable, smartrecruiters,
# recruitee, workday, remoteok, hackernews, simplifyjobs, arbeitnow, jobicy,
# himalayas, themuse, jooble, arbeitsagentur, reed
#
# Tip: many companies are on more than one ATS over time. If a board 404s,
# remove that line or try a different ATS for the same company.

