<header class="masthead">
  <div class="masthead-left">
    <span class="brand">job<span class="brand-mark">·</span>hunt</span>
    <span class="brand-tagline">a quiet job paper</span>
  </div>
  <div class="masthead-date">
    {% if last_updated is defined and last_updated %}Updated {{ last_updated }}{% else %}{{ today if today is defined else '' }}{% endif %}
  </div>
  <div class="masthead-meta">
    {% if total is defined %}<span class="counter">{{ "{:,}".format(total) }} jobs</span>{% endif %}
    <button id="refresh-btn" type="button" data-action="refresh" aria-label="Pull the latest jobs from every configured source">Refresh sources</button>
    <span id="refresh-status" class="refresh-status" aria-live="polite"></span>
  </div>
</header>
<nav class="subnav" aria-label="Sections">
  <a href="/" class="{% if nav == 'search' %}active{% endif %}">Jobs</a>
  <a href="/local" class="{% if nav == 'local' %}active{% endif %}">Local</a>
  <a href="/freelance" class="{% if nav == 'freelance' %}active{% endif %}">Freelance</a>
  <a href="/apply" class="{% if nav == 'apply' %}active{% endif %}">Apply</a>
  <a href="/alerts" class="{% if nav == 'alerts' %}active{% endif %}">Alerts</a>
  <a href="/cv" class="{% if nav == 'cv' %}active{% endif %}">CV Match</a>
  <a href="/sources" class="{% if nav == 'sources' %}active{% endif %}">Sources</a>
  <a href="/settings" class="{% if nav == 'settings' %}active{% endif %}">Settings</a>
  <a href="/help" class="{% if nav == 'help' %}active{% endif %}">Help</a>
</nav>
