[project]
name = "jobhunt-app"
version = "0.13.3"
description = "Local-first, scrape-friendly software engineering job aggregator with rich filtering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abdalla Bakr" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # httpx pulls httpcore transitively, but pinning it explicitly survives the
    # rare uv-tool-cache scenario where the transitive dep gets evicted and
    # the runtime crashes with ModuleNotFoundError: 'httpcore' (seen 2026-05-28
    # against a 0.7.x install).
    "httpcore>=1.0",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
match = [
    # Optional: enables local CV semantic matching. Adds ~500MB of deps.
    "sentence-transformers>=3.3",
    "numpy>=1.26",
]
linkedin = [
    # Optional: opt-in only. LinkedIn ToS does not allow scraping. Use at your own risk.
    "python-jobspy>=1.1.79",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
jobhunt = "jobhunt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunt"]

[tool.hatch.build.targets.sdist]
include = [
  "src/jobhunt",
  "tests",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "Dockerfile",
  "docker-compose.yml",
  ".env.example",
  "scripts",
  "jobhunt.spec",
  "packaging",
  "docs",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: browser E2E tests (run with -m e2e)"]
addopts = "-m 'not e2e'"
